services:
  - type: web
    name: onemedical-v2-identity
    env: node
    plan: free
    rootDir: Server/identity-service
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        sync: false
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: OTP_DEV_MODE
        value: "true"
      - key: CLINICAL_SERVICE_URL
        value: https://onemedical-v2-clinical.onrender.com
      - key: RABBITMQ_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: onemedical-otp

  - type: web
    name: onemedical-v2-clinical
    env: node
    plan: free
    rootDir: Server/clinical-service
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5003
      - key: MONGO_URI
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: IDENTITY_SERVICE_URL
        value: https://onemedical-v2-identity.onrender.com
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: onemedical-v2-gateway
    env: node
    plan: free
    rootDir: Server/gateway
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: IDENTITY_SERVICE_URL
        value: https://onemedical-v2-identity.onrender.com
      - key: CLINICAL_SERVICE_URL
        value: https://onemedical-v2-clinical.onrender.com
      - key: INTERNAL_API_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false

version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: onemedical_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - onemedical_network

  redis:
    image: redis:7.0-alpine
    container_name: onemedical_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - onemedical_network

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: onemedical_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - onemedical_network

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:

networks:
  onemedical_network:
    driver: bridge
